<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FXWizzy - AI Trading Assistant</title>
    <style>
        :root {
            --primary-bg: #3a0b2a; /* Dark magenta background */
            --secondary-bg: #4d1038;
            --accent-color: #e91e63; /* Logo magenta */
            --text-main: #ffffff;
            --text-muted: #d1b3c4;
            --gold-accent: #d4af37;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--secondary-bg);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo-container {
            display: flex;
            align-items: center;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            font-style: italic;
        }

        .logo-fx { color: #e91e63; text-shadow: 1px 1px 2px #000; }
        .logo-w { color: var(--gold-accent); text-shadow: 1px 1px 2px #000; }
        .logo-i { color: #ffffff; text-shadow: 1px 1px 2px #000; }
        .logo-zz { color: #4caf50; text-shadow: 1px 1px 2px #000; }
        .logo-y { color: #4caf50; text-shadow: 1px 1px 2px #000; font-size: 34px; line-height: 0; }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .upload-section, .analysis-section {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            flex: 1;
            min-width: 300px;
            backdrop-filter: blur(10px);
        }

        h2 {
            color: var(--gold-accent);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .upload-area {
            border: 2px dashed var(--text-muted);
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--accent-color);
            background-color: rgba(233, 30, 99, 0.1);
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: #c2185b;
        }

        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--gold-accent);
            border-radius: 4px;
            display: none;
            animation: fadeIn 0.5s ease-in;
        }

        .signal-title {
            color: #4caf50;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .signal-details p {
            margin: 8px 0;
            font-size: 16px;
        }

        .highlight { color: var(--gold-accent); font-weight: bold; }
        .danger { color: #ff5252; font-weight: bold; }

        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .logo-container { font-size: 22px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- This is a text representation of your logo. You can replace this with an <img> tag if you have the logo file -->
            <span class="logo-fx">fx</span><span class="logo-w">w</span><span class="logo-i">i</span><span class="logo-zz">zz</span><span class="logo-y">y</span>
        </div>
        <div style="font-size: 14px; color: var(--text-muted);">AI Trading Assistant</div>
    </header>

    <div class="container">
        <!-- Upload Section -->
        <div class="upload-section">
            <h2>1. Upload Chart</h2>
            <label for="chartUpload" class="upload-area" id="dropZone">
                <div style="font-size: 40px; margin-bottom: 10px;">📊</div>
                <p>Click to upload or drag & drop your chart</p>
                <p style="font-size: 12px; color: var(--text-muted);">Supports JPG, PNG (Forex, Gold, Crypto)</p>
                <input type="file" id="chartUpload" accept="image/*">
                <img id="imagePreview" class="preview-image" alt="Chart Preview">
            </label>
            <button class="btn" id="analyzeBtn" disabled>Analyze Chart with FXWizzy</button>
        </div>

        <!-- Analysis Section -->
        <div class="analysis-section">
            <h2>2. Mentor Analysis</h2>
            <div id="placeholderText" style="color: var(--text-muted); text-align: center; margin-top: 50px;">
                <p>Awaiting chart upload...</p>
                <p style="font-size: 12px;">Upload a screenshot to get Smart Money Concepts, Liquidity Zones, and precise Entry/SL/TP setups.</p>
            </div>
            
            <div class="loader" id="loader"></div>

            <div class="result-box" id="resultBox">
                <div class="signal-title" id="signalTitle">FXWizzy Signal</div>
                <div class="signal-details" id="signalDetails">
                    <!-- Dynamic content will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('chartUpload');
        const imagePreview = document.getElementById('imagePreview');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('resultBox');
        const placeholderText = document.getElementById('placeholderText');
        const dropZone = document.getElementById('dropZone');

        // Handle Image Upload and Preview
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                    imagePreview.style.display = 'block';
                    analyzeBtn.disabled = false;
                    // Hide previous results
                    resultBox.style.display = 'none';
                    placeholderText.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // Simulate AI Analysis (Since this is a front-end demo)
        analyzeBtn.addEventListener('click', function() {
            // UI Updates
            analyzeBtn.disabled = true;
            analyzeBtn.innerText = 'Analyzing...';
            placeholderText.style.display = 'none';
            resultBox.style.display = 'none';
            loader.style.display = 'block';

            // Simulate Network Delay (2.5 seconds)
            setTimeout(() => {
                loader.style.display = 'none';
                resultBox.style.display = 'block';
                analyzeBtn.disabled = false;
                analyzeBtn.innerText = 'Analyze Chart with FXWizzy';

                // Generate a simulated professional trading signal
                const signals = [
                    {
                        asset: "XAUUSD (Gold)",
                        direction: "BUY",
                        entry: "2315.50",
                        sl: "2308.00",
                        tp1: "2325.00",
                        tp2: "2338.00",
                        reason: "HTF Bullish trend. Price swept Asian session low (Liquidity grab). 15m Market Structure Shift (MSS) confirmed. FVG left open at entry zone."
                    },
                    {
                        asset: "EURUSD",
                        direction: "SELL",
                        entry: "1.08520",
                        sl: "1.08850",
                        tp1: "1.08100",
                        tp2: "1.07800",
                        reason: "Daily Order Block rejection. Swept London high liquidity. 5m ChoCh confirmed. Targeting internal range liquidity."
                    },
                    {
                        asset: "GBPJPY",
                        direction: "BUY",
                        entry: "192.450",
                        sl: "191.800",
                        tp1: "193.500",
                        tp2: "194.200",
                        reason: "4H Bullish Order Block tap. Swept recent low. Strong displacement to the upside. Entering on the retracement to the 61.8% Fibonacci level."
                    }
                ];

                // Pick a random signal to simulate AI
                const randomSignal = signals[Math.floor(Math.random() * signals.length)];

                document.getElementById('signalTitle').innerText = `Signal: ${randomSignal.asset} - ${randomSignal.direction}`;
                
                // Color based on direction
                document.getElementById('signalTitle').style.color = randomSignal.direction === 'BUY' ? '#4caf50' : '#ff5252';

                document.getElementById('signalDetails').innerHTML = `
                    <p><span class="highlight">Asset:</span> ${randomSignal.asset}</p>
                    <p><span class="highlight">Direction:</span> <strong style="color: ${randomSignal.direction === 'BUY' ? '#4caf50' : '#ff5252'};">${randomSignal.direction}</strong></p>
                    <p><span class="highlight">Entry:</span> ${randomSignal.entry}</p>
                    <p><span class="danger">Stop Loss:</span> ${randomSignal.sl}</p>
                    <p><span class="highlight">Take Profit 1:</span> ${randomSignal.tp1}</p>
                    <p><span class="highlight">Take Profit 2:</span> ${randomSignal.tp2}</p>
                    <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;">
                    <p style="font-size: 14px; color: var(--text-muted);"><em><strong>Mentor Notes:</strong> ${randomSignal.reason}</em></p>
                `;

            }, 2500);
        });
    </script>
</body>
</html>
